# ─────────────────────────────────────────────────────────────────────────────
# Production stack
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d --build
#
# Required env file: infra/.env.prod  (copy from infra/.env.prod.example)
# ─────────────────────────────────────────────────────────────────────────────

x-common: &common
  restart: unless-stopped
  networks:
    - welfare_net

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: welfare_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-welfare_ai}
      POSTGRES_USER: ${POSTGRES_USER:-welfare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-welfare} -d ${POSTGRES_DB:-welfare_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  neo4j:
    <<: *common
    image: neo4j:5-community
    container_name: welfare_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  qdrant:
    <<: *common
    image: qdrant/qdrant:latest
    container_name: welfare_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *common
    image: redis:7-alpine
    container_name: welfare_redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ────────────────────────────────────────────────────────────
  api:
    <<: *common
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: welfare_api
    image: welfare-ai/api:latest
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-welfare}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-welfare_ai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: welfare_policies
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-welfare-ai-rag}
      LANGCHAIN_ENDPOINT: https://api.smith.langchain.com
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:-}
      PUBLIC_DATA_API_KEY: ${PUBLIC_DATA_API_KEY:-}
      BOKJIRO_API_KEY: ${BOKJIRO_API_KEY:-}
      YOUTH_CENTER_API_KEY: ${YOUTH_CENTER_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:3001/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    <<: *common
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:3001}
    container_name: welfare_web
    image: welfare-ai/web:latest
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${WEB_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Server-side API URL (internal docker network)
      API_URL: http://api:3001
      # Client-side API URL (public, accessed from browser)
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:

networks:
  welfare_net:
    driver: bridge
